<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InvenTrack — Shipments</title>
  <meta name="description" content="Track incoming shipments and restock your warehouse inventory.">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <button class="mobile-toggle">☰</button>

  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h2>Incoming Shipments</h2>
          <p>Log and track stock received from suppliers</p>
        </div>
        <div class="header-actions">
          <button class="btn btn-secondary" onclick="DB.downloadCSV(DB.exportShipmentsCSV(), 'shipments-report.csv')">
            📥 Export CSV
          </button>
          <button class="btn btn-primary" onclick="openShipmentModal()">＋ Log Shipment</button>
        </div>
      </div>

      <!-- Stats -->
      <div class="stats-grid" id="shipmentStats"></div>

      <!-- Shipments Table -->
      <div class="card">
        <div class="card-header">
          <h3>📋 Shipment History</h3>
        </div>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Product</th>
                <th>SKU</th>
                <th>Quantity</th>
                <th>Supplier</th>
                <th>Notes</th>
              </tr>
            </thead>
            <tbody id="shipmentsTableBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Add Shipment Modal -->
  <div class="modal-overlay" id="shipmentModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Log Incoming Shipment</h3>
        <button class="modal-close" onclick="closeModal('shipmentModal')">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Product *</label>
          <select class="form-select" id="shipmentProduct">
            <option value="">Select a product</option>
          </select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Quantity Received *</label>
            <input type="number" class="form-input" id="shipmentQuantity" min="1" placeholder="0">
          </div>
          <div class="form-group">
            <label class="form-label">Date</label>
            <input type="date" class="form-input" id="shipmentDate">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Supplier</label>
          <input type="text" class="form-input" id="shipmentSupplier" placeholder="e.g. TechCorp Inc.">
        </div>
        <div class="form-group">
          <label class="form-label">Notes</label>
          <textarea class="form-textarea" id="shipmentNotes" placeholder="Additional notes..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('shipmentModal')">Cancel</button>
        <button class="btn btn-primary" onclick="saveShipment()">Log Shipment</button>
      </div>
    </div>
  </div>

  <script src="scripts/data.js"></script>
  <script src="scripts/ui.js"></script>
  <script src="scripts/shipments.js"></script>
</body>
</html>
