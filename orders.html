<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OCTANE — Order History</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/shared/general.css">
  <link rel="stylesheet" href="styles/shared/octane-header.css">
  <link rel="stylesheet" href="styles/pages/orders.css">
</head>

<body>
  <!-- OCTANE Navigation Bar -->
  <header class="octane-header amazon-header">
    <div class="octane-header-left-section amazon-header-left-section">
      <a href="amazon.html" class="octane-logo-container" title="OCTANE Homepage">
        <div class="octane-logo-badge">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M13 2L3 14H12L11 22L21 10H12L13 2Z" fill="url(#octane-bolt-orders)" stroke="#ff7a18" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
            <defs>
              <linearGradient id="octane-bolt-orders" x1="3" y1="2" x2="21" y2="22" gradientUnits="userSpaceOnUse">
                <stop stop-color="#FF5E14"/>
                <stop offset="1" stop-color="#FFA800"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="octane-brand-text">
          <span class="octane-brand-name">OCTANE</span>
          <span class="octane-brand-tag">GEAR & ESSENTIALS</span>
        </div>
      </a>
    </div>

    <div class="octane-header-middle-section amazon-header-middle-section">
      <div class="octane-search-wrapper">
        <input class="search-bar js-search-bar octane-search-input" type="text" placeholder="Search orders, tracking, or items...">
        <button class="search-button js-search-button octane-search-btn" title="Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </div>
    </div>

    <div class="octane-header-right-section amazon-header-right-section">
      <a class="header-link warehouse-pill" href="inventory-tracker/index.html" title="Open Warehouse & Inventory Management">
        <span class="nav-icon-badge">📦</span>
        <div class="nav-text-col">
          <span class="nav-text-label">Management</span>
          <span class="nav-text-value">Warehouse</span>
        </div>
      </a>

      <a class="orders-link header-link" href="orders.html" title="View Your Orders">
        <span class="nav-icon-badge">⚡</span>
        <div class="nav-text-col">
          <span class="nav-text-label">Tracking</span>
          <span class="nav-text-value">Orders</span>
        </div>
      </a>

      <a class="cart-link header-link" href="checkout.html" title="View Shopping Cart">
        <div class="cart-icon-wrapper">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <div class="cart-quantity js-cart-quantity">0</div>
        </div>
        <div class="nav-text-col">
          <span class="nav-text-label">Shopping</span>
          <span class="nav-text-value">Cart</span>
        </div>
      </a>
    </div>
  </header>

  <div class="main">
    <div class="page-title">Your Orders & Dispatches</div>
    <div class="orders-grid js-orders-grid">
    </div>
  </div>

  <script src="data/cart.js"></script>
  <script src="scripts/orders.js"></script>
</body>

</html>
